version: '3.8'

services:
  cbs-server:
    build:
      context: .
      dockerfile: Dockerfile.cbs
    container_name: bharat_bank_cbs_server
    ports:
      - "${CBS_PORT:-8000}:8000"
    environment:
      - PORT=8000
    restart: unless-stopped
    networks:
      - bharat_bank_net

  omnichannel-backend:
    build:
      context: .
      dockerfile: Dockerfile.digital
    container_name: bharat_bank_omnichannel_backend
    ports:
      - "${DIGITAL_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - CBS_BASE_URL=http://cbs-server:8000
    depends_on:
      - cbs-server
    restart: unless-stopped
    networks:
      - bharat_bank_net

networks:
  bharat_bank_net:
    driver: bridge
